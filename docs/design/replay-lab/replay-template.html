<div id="chaospilot-replay-lab" class="cprl-root">
<style>
#chaospilot-replay-lab{--bg:#0b1220;--line:#22345a;--text:#e8eef8;--muted:#9db0cc;--cyan:#39d5e8;--coral:#ff6b6b;--amber:#f5c86b;--green:#52d19a;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px 22px 16px;border-radius:14px;max-width:1024px;margin:0 auto;box-sizing:border-box}
#chaospilot-replay-lab *{box-sizing:border-box}
#chaospilot-replay-lab h2{font-size:19px;font-weight:500;margin:0}
#chaospilot-replay-lab h3{font-size:15px;font-weight:500;margin:0 0 10px;color:var(--cyan)}
#chaospilot-replay-lab p{font-size:13px;line-height:1.5;margin:6px 0}
#chaospilot-replay-lab .cprl-muted{color:var(--muted)}
#chaospilot-replay-lab .cprl-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
#chaospilot-replay-lab .cprl-head>label{min-width:0;max-width:100%;flex:0 1 430px}
#chaospilot-replay-lab label{font-size:12px;color:var(--muted);display:grid;gap:4px}
#chaospilot-replay-lab select,#chaospilot-replay-lab button,#chaospilot-replay-lab input[type=range]{font:inherit;font-size:13px}
#chaospilot-replay-lab select{background:#111c30;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:100%;width:100%;min-width:0}
#chaospilot-replay-lab button{background:#111c30;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:36px}
#chaospilot-replay-lab #cprl-play{background:var(--text);color:var(--bg);min-width:66px}
#chaospilot-replay-lab button:disabled{opacity:.45;cursor:default}
#chaospilot-replay-lab button[aria-pressed="true"]{background:var(--cyan);color:#06202a;border-color:var(--cyan)}
#chaospilot-replay-lab .cprl-stage{position:relative;padding:26px 4px 4px;margin-top:8px}
#chaospilot-replay-lab .cprl-track-svg{position:absolute;left:0;right:0;top:20px;width:100%;height:22px;pointer-events:none}
#chaospilot-replay-lab .cprl-nodes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:start}
#chaospilot-replay-lab .cprl-node{text-align:center;padding:0 6px;min-height:78px}
#chaospilot-replay-lab .cprl-node small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
#chaospilot-replay-lab .cprl-node .cprl-node-value{font-size:16px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
#chaospilot-replay-lab .cprl-dot{width:11px;height:11px;border-radius:50%;background:var(--cyan);margin:0 auto 10px;position:relative;z-index:1}
#chaospilot-replay-lab .cprl-dot-system{background:#e8eef8}
#chaospilot-replay-lab .cprl-dot-change{background:var(--muted)}
#chaospilot-replay-lab .cprl-node:has(.cprl-on) .cprl-dot-change{background:var(--coral);box-shadow:0 0 0 7px #ff6b6b15}
#chaospilot-replay-lab .cprl-node:has(.cprl-group) .cprl-dot-change{background:var(--amber);box-shadow:0 0 0 7px #f5c86b15}
#chaospilot-replay-lab .cprl-marker{display:none;margin:8px auto 0;width:max-content;max-width:100%;color:#ffd7d7;font-size:12px;border:1px solid var(--coral);border-radius:999px;padding:3px 10px}
#chaospilot-replay-lab .cprl-marker.cprl-on{display:block}
#chaospilot-replay-lab .cprl-marker.cprl-group{color:#ffe9bb;border-color:var(--amber)}
#chaospilot-replay-lab .cprl-caption{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#chaospilot-replay-lab .cprl-banner{margin-top:8px;font-size:13px;text-align:center;color:var(--muted)}
#chaospilot-replay-lab .cprl-banner.cprl-bad{color:#ffd7d7}
#chaospilot-replay-lab .cprl-banner.cprl-warn{color:#ffe9bb}
#chaospilot-replay-lab .cprl-lens{padding:20px 4px 6px;margin-top:10px;overflow:hidden}
#chaospilot-replay-lab .cprl-big{font-size:42px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
#chaospilot-replay-lab .cprl-comparison{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:8px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
#chaospilot-replay-lab .cprl-comparison .cprl-field{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
#chaospilot-replay-lab .cprl-comparison small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
#chaospilot-replay-lab .cprl-comparison strong{font-size:34px;font-weight:500;line-height:1.1;overflow-wrap:anywhere}
#chaospilot-replay-lab .cprl-arrow{color:var(--cyan);font-size:26px}
#chaospilot-replay-lab .cprl-big .cprl-arrow{color:var(--cyan);padding:0 8px}
#chaospilot-replay-lab .cprl-stack{position:relative;height:30px;background:#1a2947;border-radius:8px;margin:14px 0 6px}
#chaospilot-replay-lab .cprl-seg{position:absolute;top:0;height:100%}
#chaospilot-replay-lab .cprl-seg-used{background:var(--cyan);border-radius:8px 0 0 8px}
#chaospilot-replay-lab .cprl-seg-reserved{background:var(--amber)}
#chaospilot-replay-lab .cprl-limit{position:absolute;top:-7px;bottom:-7px;width:2px;background:#fff}
#chaospilot-replay-lab .cprl-limit span{position:absolute;top:-18px;right:0;font-size:11px;color:var(--text);white-space:nowrap}
#chaospilot-replay-lab .cprl-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:22px}
#chaospilot-replay-lab .cprl-sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#chaospilot-replay-lab .cprl-signed{height:18px;background:#1a2947;border-radius:6px;position:relative;margin:8px 0}
#chaospilot-replay-lab .cprl-signed-fill{position:absolute;top:0;height:100%;background:repeating-linear-gradient(45deg,var(--coral),var(--coral) 6px,#b94a5e 6px,#b94a5e 12px);border-radius:6px}
#chaospilot-replay-lab .cprl-steps{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline;margin:10px 0}
#chaospilot-replay-lab .cprl-dock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;padding-top:14px}
#chaospilot-replay-lab .cprl-dock input[type=range]{flex:1 1 160px;accent-color:var(--cyan)}
#chaospilot-replay-lab details{margin-top:12px;padding:10px 2px}
#chaospilot-replay-lab summary{font-size:13px;color:var(--muted)}
#chaospilot-replay-lab pre{white-space:pre-wrap;word-break:break-word;font-size:11px;max-height:340px;overflow:auto;color:var(--muted)}
@media (max-width:736px){#chaospilot-replay-lab{padding:16px 14px}#chaospilot-replay-lab .cprl-nodes{grid-template-columns:1fr;gap:10px}#chaospilot-replay-lab .cprl-node{text-align:left;min-height:54px;padding-left:24px;border-left:1px solid var(--line);position:relative}#chaospilot-replay-lab .cprl-dot{position:absolute;left:-6px;top:0;margin:0}#chaospilot-replay-lab .cprl-marker{margin-left:0}#chaospilot-replay-lab .cprl-track-svg{display:none}#chaospilot-replay-lab .cprl-big{font-size:32px}#chaospilot-replay-lab .cprl-comparison strong{font-size:24px}#chaospilot-replay-lab select{max-width:100%;width:100%;font-size:16px}#chaospilot-replay-lab button{min-height:44px}}
@media (prefers-reduced-motion: reduce){#chaospilot-replay-lab *{transition:none!important;animation:none!important}}
</style>
<div class="cprl-head">
  <div><h2>ChaosPilot <span class="cprl-muted">/ Replay</span></h2><p class="cprl-muted" id="cprl-provenance">Recorded playback</p></div>
  <label>Explore a finding <select id="cprl-case" aria-label="Select replay case" class="cursor-interaction"></select></label>
</div>
<p class="cprl-muted"><span id="cprl-system">Recorded system</span> · <span id="cprl-summary">No violation recorded</span></p>
<section class="cprl-stage" aria-label="Schematic recorded event flow">
  <svg class="cprl-track-svg" viewBox="0 0 1000 22" preserveAspectRatio="none" role="img" aria-label="Packet path between the recorded event, system and observed change nodes"><line x1="167" y1="11" x2="833" y2="11" stroke="#22345a" stroke-width="2"/><circle id="cprl-packet" cx="167" cy="11" r="7" fill="#39d5e8" opacity="0"/></svg>
  <div class="cprl-nodes">
    <div class="cprl-node" id="cprl-node-event"><div class="cprl-dot" aria-hidden="true"></div><small>Recorded event</small><span class="cprl-node-value" id="cprl-event">—</span></div>
    <div class="cprl-node" id="cprl-node-system"><div class="cprl-dot cprl-dot-system" aria-hidden="true"></div><small>System under test</small><span class="cprl-node-value" id="cprl-flow-state">Recorded</span></div>
    <div class="cprl-node" id="cprl-node-change"><div class="cprl-dot cprl-dot-change" aria-hidden="true"></div><small>Observed state</small><span class="cprl-node-value" id="cprl-change">—</span><div class="cprl-marker" id="cprl-marker" role="status"></div></div>
  </div>
  <p class="cprl-caption" id="cprl-caption" aria-live="polite">—</p>
  <div class="cprl-banner" id="cprl-banner" role="status">No violation recorded</div>
</section>
<section class="cprl-lens" id="cprl-lens" aria-label="Evidence lens"></section>
<div class="cprl-dock" aria-label="Playback controls">
  <button type="button" id="cprl-prev" aria-label="Previous step">Previous</button>
  <button type="button" id="cprl-play" aria-pressed="false">Play</button>
  <button type="button" id="cprl-next" aria-label="Next step">Next</button>
  <button type="button" id="cprl-jump">Jump to finding</button>
  <label style="flex:1 1 180px">Step <input type="range" id="cprl-range" min="0" max="0" value="0" aria-label="Scrub recorded steps"></label>
  <span id="cprl-counter">Step 0 of 0</span>
</div>
<details>
  <summary>Raw recorded evidence for this step</summary>
  <pre id="cprl-raw">—</pre>
</details>

</script>
</div>
